/* ═══ 基準日（動的） ═══ */
const TODAY = new Date();
TODAY.setHours(0,0,0,0);
const TODAY_STR = `${TODAY.getFullYear()}.${String(TODAY.getMonth()+1).padStart(2,'0')}.${String(TODAY.getDate()).padStart(2,'0')}`;
const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TODAY_DISPLAY = `${TODAY_STR} ${WEEKDAYS[TODAY.getDay()]}`;
const TODAY_JP = `${TODAY.getFullYear()}年${TODAY.getMonth()+1}月${TODAY.getDate()}日（${'日月火水木金土'[TODAY.getDay()]}）`;

/* ═══ ユーティリティ（統一ロジック） ═══ */
function calcElapsedDays(d){return d?Math.ceil((TODAY-new Date(d))/86400000):0;}
function calcRemainingDays(d){return d?Math.ceil((new Date(d)-TODAY)/86400000):null;}
function formatShortDate(d){return d?d.slice(5).replace('-','/'):'';}

function calcTimeInfo(setDate, deadline) {
  const elapsed = calcElapsedDays(setDate);
  const remaining = calcRemainingDays(deadline);
  const totalSpan = elapsed + Math.max(0, remaining || 0);
  const isOverdue = remaining !== null && remaining < 0;
  const overdueDays = isOverdue ? Math.abs(remaining) : 0;
  const timePercent = isOverdue ? 100 : (totalSpan > 0 ? Math.min(100, Math.max(0, (elapsed / totalSpan) * 100)) : 0);
  return { elapsed, remaining, totalSpan, isOverdue, overdueDays, timePercent };
}

/* ─── 進捗バー + 残日数（シンプル版） ─── */
function ProgressRow({setDate,deadline,progress,isWarn}){
  const info = calcTimeInfo(setDate, deadline);
  const progressPercent=Math.min(100,Math.max(0,progress||0));
  return(
    <div className="progress-row">
      <div className="progress-bar-wrap">
        <div className="progress-track">
          <div className="progress-fill" style={{
            width:progressPercent+"%",
            background:isWarn?'var(--amber)':progressPercent>60?'var(--green)':'var(--blue)'
          }}/>
        </div>
        <span className="progress-pct" style={{color:isWarn?'var(--amber)':progressPercent>60?'var(--green)':'var(--blue)'}}>{progressPercent}%</span>
      </div>
      <span className={info.isOverdue?"progress-days progress-days--overdue":"progress-days"} style={{color:info.isOverdue?'var(--red)':info.remaining!==null&&info.remaining<7?'var(--amber)':'var(--ink-3)'}}>
        {info.isOverdue?`${info.overdueDays}日超過`:info.remaining!==null?`残${info.remaining}日`:''}
      </span>
    </div>
  );
}

/* ─── パスポップアップ ─── */
function PathPopup({show,goal,onClose}){
  if(!show||!goal) return null;
  const p=goal.path||[];
  const levels=[{label:"最上位",color:"var(--blue)",bg:"var(--blue-light)"},{label:"中間",color:"var(--amber)",bg:"var(--amber-light)"},{label:"中間",color:"var(--amber)",bg:"var(--amber-light)"},{label:"中間",color:"var(--amber)",bg:"var(--amber-light)"}];
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div><div className="modal-title">ゴールパス</div><div className="modal-sub">上位からフォーカスゴールまでの経路</div></div>
          <button className="modal-close" onClick={onClose}><Icon.close/></button>
        </div>
        <div className="path-list">
          {p.map((step,i)=>{
            const isLast=i===p.length-1;
            const lv=isLast?{label:"フォーカスゴール",color:"var(--green)",bg:"var(--green-light)"}:(levels[i]||levels[1]);
            return(
              <div key={i} className="path-item">
                <div className="path-rail"><div className="path-dot" style={{background:lv.color}}/>{!isLast&&<div className="path-line"/>}</div>
                <div className={"path-body"+(isLast?" path-body--leaf":"")}>
                  <span className="path-label" style={{color:lv.color}}>{lv.label}</span>
                  <span className="path-text">{step}</span>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ─── ゴールカード（円形バッジ廃止） ─── */
function GoalCard({goal,onConfirm,onPath,delay=0}){
  const[vis,setVis]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setVis(true),delay);return()=>clearTimeout(t);},[delay]);
  const isWarn=goal.status==="warning"||goal.alertKey;
  const remaining=calcRemainingDays(goal.deadline);
  const alertText=getAlertText(goal.alertKey);
  return(
    <div className={"g-card"+(isWarn?" g-card--warn":"")} style={{opacity:vis?1:0,transform:vis?"translateY(0)":"translateY(8px)",transition:"opacity 0.4s ease, transform 0.4s ease"}}>
      <div className="g-info">
        <div className="g-title">{goal.title}</div>
        {alertText&&<div className="g-alert"><Icon.alert style={{width:11,height:11}}/> {alertText}</div>}
        <div className="g-meta">
          <span>設定 {formatShortDate(goal.setDate)}</span>
          {goal.deadline&&<><span className="g-meta-sep">→</span><span style={{color:remaining!==null&&remaining<0?'var(--red)':remaining!==null&&remaining<7?'var(--amber)':'var(--ink-3)'}}>期限 {formatShortDate(goal.deadline)}{remaining!==null&&(remaining<0?` (${Math.abs(remaining)}日超過)`:`（残${remaining}日）`)}</span></>}
        </div>
      </div>
      <ProgressRow setDate={goal.setDate} deadline={goal.deadline} progress={goal.progress} isWarn={isWarn}/>
      <div className="g-actions">
        <button className="g-btn g-btn--path" onClick={()=>onPath(goal)}><Icon.route/> パス照会</button>
        {isWarn&&<button className={"g-btn g-btn--ack"+(goal.confirmed?" g-btn--acked":"")} onClick={()=>onConfirm(goal.id)}><Icon.check/> {goal.confirmed?"確認済み":"確認する"}</button>}
        <button className="g-btn g-btn--detail">詳細 <Icon.external/></button>
      </div>
    </div>
  );
}

/* ─── メンバーカード ─── */
function MemberCard({name,goals,onConfirm,onPath,delay=0}){
  const[open,setOpen]=useState(false);
  const[vis,setVis]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setVis(true),delay);return()=>clearTimeout(t);},[delay]);
  const alerts=goals.filter(g=>g.alertKey).length;
  const avgProgress=goals.length>0?Math.round(goals.reduce((s,g)=>s+(g.progress||0),0)/goals.length):0;
  return(
    <div className={"m-card"+(alerts>0?" m-card--warn":"")} style={{opacity:vis?1:0,transform:vis?"translateY(0)":"translateY(8px)",transition:"opacity 0.4s ease, transform 0.4s ease"}}>
      <div className="m-head" onClick={()=>setOpen(!open)}>
        <div className="m-head-left">
          <div className="m-avatar" style={{background:alerts>0?'var(--amber-light)':'var(--green-light)',color:alerts>0?'var(--amber)':'var(--green)'}}>{name[0]}</div>
          <div>
            <div className="m-name">{name}</div>
            <div className="m-sub">フォーカスゴール {goals.length}件 ｜ 平均進捗 {avgProgress}%</div>
          </div>
        </div>
        <div className="m-head-right">
          {alerts>0&&<span className="m-alert-badge"><Icon.alert style={{width:10,height:10}}/> 注意{alerts}</span>}
          {alerts===0&&<span className="m-ok-badge">✓ 順調</span>}
          <span className={"m-arrow"+(open?" m-arrow--open":"")}><Icon.chevron/></span>
        </div>
      </div>
      {open&&(
        <div className="m-body">
          {goals.map((g,i)=><GoalCard key={g.id} goal={g} onConfirm={onConfirm} onPath={onPath} delay={i*50}/>)}
        </div>
      )}

  );
}

/* ─── サマリーカード ─── */
function SummaryGrid({items}){

    <div className="sum-grid">
      {items.map((c,i)=>(
        <div key={i} className="sum-card" style={{borderTopColor:c.accent}}>
          <div className="sum-label">{c.label}</div>

        </div>
      ))}
    </div>
  );
}

/* ─── ツリーノード ─── */
function TreeNode({node,depth=0}){
  const[open,setOpen]=useState(depth<2);
  const hasKids=node.children&&node.children.length>0;
  const isWarn=node.status==="warning";
  const color=isWarn?'var(--amber)':'var(--green)';
  return(
    <div style={{marginLeft:depth>0?16:0}}>
      <div className={"tr-node"+(hasKids?" tr-node--parent":"")+(node.isLeaf?" tr-node--leaf":"")} style={{borderLeftColor:depth>0?color:'transparent'}} onClick={hasKids?()=>setOpen(!open):undefined}>
        {hasKids&&<span className={"tr-arrow"+(open?" tr-arrow--open":"")}><Icon.chevron/></span>}
        {node.isLeaf&&<span className="tr-leaf-dot" style={{background:color}}/>}
        <span className="tr-title" style={{fontWeight:node.isLeaf?400:600}}>{node.title}</span>
        {node.isLeaf&&node.progress!==undefined&&<span className="tr-progress">{node.progress}%</span>}
        {node.isLeaf&&<span className="tr-status" style={{color,background:isWarn?'var(--amber-light)':'var(--green-light)'}}>{isWarn?'!':'✓'}</span>}
        <span className="tr-owner">{node.owner}</span>
      </div>
      {open&&hasKids&&node.children.map(ch=><TreeNode key={ch.id} node={ch} depth={depth+1}/>)}
    </div>
  );
}

              {entries.map(([name,data],i)=>{

                const hasAlert=alerts>0;
                return(
                  <div key={i} className={"lb-member-row"+(hasAlert?" lb-member-row--warn":"")}>
                    <div className="lb-member-name">{name}</div>
                    <div className="lb-member-stats">
                      <span>{data.goals.length}件</span>
                      {hasAlert
                        ? <span className="lb-member-alert">注意{alerts}</span>
                        : <span className="lb-member-ok">✓</span>
                      }
                    </div>
                    {hasAlert&&<div className="lb-member-detail">
                      {data.goals.filter(g=>g.alertKey).map((g,j)=>(
                        <div key={j} className="lb-member-issue">· {g.title}</div>
                      ))}
                    </div>}
                  </div>
                );
              })}

              <div className="lb-btns" style={{marginTop:10}}><div className="lb-btn lb-btn--primary">Webで詳細を見る →</div></div>
            </LINEPhone>
          </div>
        )}

      </div></main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
