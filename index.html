function CircleProgress({value,size=44,stroke=2.5,color}){
  const r=(size-stroke*2)/2;const circ=2*Math.PI*r;const offset=circ-((value||0)/100)*circ;
  return(<div style={{position:'relative',width:size,height:size,flexShrink:0}}>
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}><circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--surface-3)" strokeWidth={stroke}/><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={offset} transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:'stroke-dashoffset 0.8s ease'}}/></svg>
    <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:size>40?12:10,fontWeight:700,color:'var(--ink)',fontFamily:'var(--font-sans)'}}>{value}<span style={{fontSize:size>40?8:7,fontWeight:600,opacity:0.6}}>%</span></div>
  </div>);
}

function PathPopup({show,goal,onClose}){
  if(!show||!goal)return null;const p=goal.path||[];
  const levels=[{label:"最上位",color:"var(--blue)"},{label:"中間",color:"var(--amber)"},{label:"中間",color:"var(--amber)"},{label:"中間",color:"var(--amber)"}];
  return(<div className="overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div className="modal-head"><div><div className="modal-title">ゴールパス</div><div className="modal-sub">上位からフォーカスゴールまでの経路</div></div><button className="modal-close" onClick={onClose}><Icon.close/></button></div>
    <div className="path-list">{p.map((step,i)=>{const isLast=i===p.length-1;const lv=isLast?{label:"フォーカスゴール",color:"var(--green)"}:(levels[i]||levels[1]);return(
      <div key={i} className="path-item"><div className="path-rail"><div className="path-dot" style={{background:lv.color}}/>{!isLast&&<div className="path-line"/>}</div><div className={"path-body"+(isLast?" path-body--leaf":"")}><span className="path-label" style={{color:lv.color}}>{lv.label}</span><span className="path-text">{step}</span></div></div>);})}</div>

function GoalCard({goal,onConfirm,onPath,delay=0,index=0}){
  const[vis,setVis]=useState(false);useEffect(()=>{const t=setTimeout(()=>setVis(true),delay);return()=>clearTimeout(t);},[delay]);
  const isWarn=goal.status==="warning"||goal.alertKey;const alertText=getAlertTextDynamic(goal.alertKey,goal.setDate);
  const remaining=calcRemainingDays(goal.deadline);const isOverdue=remaining!==null&&remaining<0;
  const pColor=isWarn?'var(--amber)':goal.progress>60?'var(--green)':'var(--accent)';
  return(<div className={"g-row"+(isWarn?" g-row--warn":"")+(index%2===0?"":" g-row--stripe")} style={{opacity:vis?1:0,transform:vis?"translateY(0)":"translateY(6px)",transition:"opacity 0.35s,transform 0.35s"}}>
    <div className="g-num">{String(index+1).padStart(2,'0')}</div>
    <div className="g-main"><div className="g-top"><div className="g-info"><div className="g-title">{goal.title}</div>{alertText&&<div className="g-alert"><Icon.alert style={{width:11,height:11}}/> {alertText}</div>}<div className="g-path">{goal.path.join(' › ')}</div></div>
      <div className="g-stats"><CircleProgress value={goal.progress} size={42} stroke={2.5} color={pColor}/><div className="g-days" style={{color:isOverdue?'var(--red)':remaining!==null&&remaining<7?'var(--amber)':'var(--ink-3)'}}>{isOverdue?`${Math.abs(remaining)}日超過`:remaining!==null?`残${remaining}日`:''}</div></div></div>
      <div className="g-actions"><button className="g-btn g-btn--path" onClick={()=>onPath(goal)}><Icon.route/> パス照会</button>{isWarn&&<button className={"g-btn g-btn--ack"+(goal.confirmed?" g-btn--acked":"")} onClick={()=>onConfirm(goal.id)}><Icon.check/> {goal.confirmed?"確認済み":"確認する"}</button>}<button className="g-btn g-btn--detail">詳細 <Icon.external/></button></div>
    </div>
  </div>);
}

function MemberCard({name,goals,onConfirm,onPath,delay=0}){
  const[open,setOpen]=useState(false);const[vis,setVis]=useState(false);
  const[sortBy,setSortBy]=useState('deadline');const[sortDir,setSortDir]=useState('asc');
  useEffect(()=>{const t=setTimeout(()=>setVis(true),delay);return()=>clearTimeout(t);},[delay]);
  const alerts=goals.filter(g=>g.alertKey).length;const avgProgress=goals.length>0?Math.round(goals.reduce((s,g)=>s+(g.progress||0),0)/goals.length):0;
  const toggleSort=f=>{if(sortBy===f)setSortDir(d=>d==='asc'?'desc':'asc');else{setSortBy(f);setSortDir('asc');}};
  const sortedGoals=useMemo(()=>{const a=[...goals];a.sort((x,y)=>{let v;if(sortBy==='deadline'){v=(calcRemainingDays(x.deadline)??999)-(calcRemainingDays(y.deadline)??999);}else{v=(x.progress||0)-(y.progress||0);}return sortDir==='asc'?v:-v;});return a;},[goals,sortBy,sortDir]);
  const pColor=alerts>0?'var(--amber)':'var(--green)';
  return(<div className={"m-card"+(alerts>0?" m-card--warn":"")} style={{opacity:vis?1:0,transform:vis?"translateY(0)":"translateY(6px)",transition:"opacity 0.4s,transform 0.4s"}}>
    <div className="m-head" onClick={()=>setOpen(!open)}>
      <div className="m-head-left">
        <CircleProgress value={avgProgress} size={40} stroke={2.5} color={pColor}/>
        <div><div className="m-name">{name}</div><div className="m-sub">ゴール {goals.length}件 ｜ 平均 {avgProgress}%</div></div>
      </div>
      <div className="m-head-right">
        {alerts>0?<span className="m-alert-badge"><Icon.alert style={{width:10,height:10}}/> 注意{alerts}</span>:<span className="m-ok-badge">✓ 順調</span>}
        <span className={"m-arrow"+(open?" m-arrow--open":"")}><Icon.chevron/></span>
      </div>
    </div>
    {open&&<div className="m-body">
      <div className="sort-bar" style={{padding:'10px 0 6px'}}><div className="section-label" style={{fontSize:9}}>ゴール一覧</div><div className="sort-buttons"><button className={"sort-btn"+(sortBy==='deadline'?" sort-btn--active":"")} onClick={()=>toggleSort('deadline')}>期限順 {sortBy==='deadline'&&(sortDir==='asc'?<Icon.sortAsc/>:<Icon.sortDesc/>)}</button><button className={"sort-btn"+(sortBy==='progress'?" sort-btn--active":"")} onClick={()=>toggleSort('progress')}>進捗順 {sortBy==='progress'&&(sortDir==='asc'?<Icon.sortAsc/>:<Icon.sortDesc/>)}</button></div></div>
      {sortedGoals.map((g,i)=><GoalCard key={g.id} goal={g} index={i} onConfirm={onConfirm} onPath={onPath} delay={i*40}/>)}
    </div>}
  </div>);
}

function App(){
  const[tab,setTab]=useState("mygoals");
  const[myGoals,setMyGoals]=useState(MY_GOALS);
  const[members,setMembers]=useState(MEMBERS);
  const[pathGoal,setPathGoal]=useState(null);

  const handleConfirm=useCallback(id=>{
    setMyGoals(p=>p.map(g=>g.id===id?{...g,confirmed:!g.confirmed}:g));
    setMembers(p=>{const n=JSON.parse(JSON.stringify(p));Object.values(n).forEach(m=>{m.goals.forEach(g=>{if(g.id===id)g.confirmed=!g.confirmed;});});return n;});
  },[]);

  const entries=useMemo(()=>Object.entries(members),[members]);
  const allMG=useMemo(()=>entries.flatMap(e=>e[1].goals),[entries]);
  const attentionCount=allMG.filter(g=>g.alertKey).length;
  const myAttention=myGoals.filter(g=>g.alertKey).length;
  const staleCount=allMG.filter(g=>g.alertKey==="stale").length;
  const granCount=allMG.filter(g=>g.alertKey==="granularity").length;
  const teamAvgProgress=allMG.length>0?Math.round(allMG.reduce((s,g)=>s+(g.progress||0),0)/allMG.length):0;

  const[sortBy,setSortBy]=useState('deadline');const[sortDir,setSortDir]=useState('asc');
  const toggleSort=useCallback(f=>{if(sortBy===f)setSortDir(d=>d==='asc'?'desc':'asc');else{setSortBy(f);setSortDir('asc');}},[sortBy]);
  const sortedMyGoals=useMemo(()=>{const a=[...myGoals];a.sort((x,y)=>{let v;if(sortBy==='deadline'){v=(calcRemainingDays(x.deadline)??999)-(calcRemainingDays(y.deadline)??999);}else{v=(x.progress||0)-(y.progress||0);}return sortDir==='asc'?v:-v;});return a;},[myGoals,sortBy,sortDir]);
  const lineMyGoals=useMemo(()=>[...myGoals].sort((a,b)=>(calcRemainingDays(a.deadline)??999)-(calcRemainingDays(b.deadline)??999)),[myGoals]);
  const tabs=[{id:"mygoals",label:"今日のゴール"},{id:"manager",label:"メンバー管理"},{id:"tree",label:"ゴールツリー"},{id:"line",label:"LINE通知"}];

  return(<div className="app">

    <div className="sticky-top">

        <button className="help-trigger" onClick={()=>setShowHelp(true)}><Icon.help/></button>

        <div key={i} className="metric-cell"><div className="metric-value" style={{color:m.color}}>{m.value}</div><div className="metric-label">{m.label}</div></div>
      ))}
    </div></div>

    </div>

    <main className="main"><div className="container">

      {tab==="mygoals"&&(<div className="page fade-in">

          <div className="lb-suggest"><div className="lb-suggest-label">注目ポイント</div><div className="lb-suggest-text">「支払調書」がしばらく更新されていません。「三上大のゴール」はもう少し具体的に分解しましょう。</div></div>
          <div className="lb-btns"><div className="lb-btn lb-btn--primary">Webで詳細を見る →</div></div>
        </LINEPhone>
        <p className="line-section-label" style={{marginTop:24}}>直下メンバー サマリー</p>
        <LINEPhone>
          <div className="lb-head" style={{borderBottomColor:'#2563eb'}}>直下メンバー（{entries.length}名）</div>
          <div className="lb-greet">注意項目 {attentionCount}件 ｜ 詳細はWebで確認</div>
          {entries.map(([name,data],i)=>{const alerts=data.goals.filter(g=>g.alertKey).length;const hasAlert=alerts>0;return(<div key={i} className={"lb-member-row"+(hasAlert?" lb-member-row--warn":"")}><div className="lb-member-name">{name}</div><div className="lb-member-stats"><span>{data.goals.length}件</span>{hasAlert?<span className="lb-member-alert">注意{alerts}</span>:<span className="lb-member-ok">✓</span>}</div>{hasAlert&&<div className="lb-member-detail">{data.goals.filter(g=>g.alertKey).map((g,j)=>(<div key={j} className="lb-member-issue">· {g.title}</div>))}</div>}</div>);})}
          <div className="lb-btns" style={{marginTop:10}}><div className="lb-btn lb-btn--primary">Webで詳細を見る →</div></div>
        </LINEPhone>
      </div>)}

    </div></main>
    <footer className="footer"><div className="container footer-inner"><span>ADDNESS FOCUS GOAL SYSTEM</span><span>v2.0</span></div></footer>
  </div>);
}

.lb-head{font-weight:700;font-size:14px;color:#1a1a1a;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #eee;}
.lb-greet{font-size:12px;color:#888;margin-bottom:10px;}
.lb-line-item{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:5px 8px;background:#f8f8f6;border-radius:6px;margin-bottom:3px;border-left:3px solid #3a8a48;}
.lb-line-item--warn{border-left-color:#b8860b;background:#fef9ee;}
.lb-line-title{font-size:11px;font-weight:500;color:#1a1a1a;flex:1;min-width:0;line-height:1.5;}
.lb-line-days{font-size:9px;font-weight:700;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums;}
.lb-suggest{background:#f8f6ff;border-radius:8px;padding:10px;margin-bottom:10px;border-left:3px solid #6b5ec4;}
.lb-suggest-label{font-size:10px;color:#6b5ec4;font-weight:700;margin-bottom:2px;}
.lb-suggest-text{font-size:11px;color:#555;line-height:1.5;}
.lb-btns{display:flex;gap:5px;}.lb-btn{flex:1;text-align:center;padding:8px 0;border-radius:8px;background:#f0f0ee;color:#666;font-size:11px;font-weight:600;}.lb-btn--primary{background:#4a7048;color:#fff;}
.lb-member-row{padding:6px 8px;background:#f8f8f6;border-radius:6px;margin-bottom:4px;border-left:3px solid #3a8a48;}
.lb-member-row--warn{border-left-color:#b8860b;background:#fef9ee;}
.lb-member-name{font-size:11px;font-weight:700;color:#1a1a1a;}
.lb-member-stats{display:flex;align-items:center;gap:8px;font-size:10px;color:#999;margin-top:2px;}
.lb-member-alert{color:#b8860b;font-weight:600;}.lb-member-ok{color:#3a8a48;font-weight:600;}
.lb-member-detail{margin-top:3px;padding-left:4px;}.lb-member-issue{font-size:9px;color:#b8860b;line-height:1.5;}
.footer{border-top:var(--border-thick);padding:16px 0;transition:border-color 0.4s;}
.footer-inner{display:flex;justify-content:space-between;font-size:9px;color:var(--ink-4);letter-spacing:2px;font-family:var(--font-sans);}
.help-modal{background:var(--card);border-radius:var(--radius-lg);max-width:520px;width:100%;max-height:85vh;box-shadow:var(--shadow-lg);animation:fadeIn 0.25s ease;display:flex;flex-direction:column;overflow:hidden;border:var(--border-thin);transition:background 0.4s;}
.help-modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:var(--border-thin);}
.help-modal-title{font-size:17px;font-weight:800;color:var(--ink);font-family:var(--font-sans);}
.help-tabs{display:flex;gap:2px;padding:12px 16px;overflow-x:auto;border-bottom:var(--border-thin);flex-shrink:0;}
.help-tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 10px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-family:var(--font-sans);transition:all 0.15s;flex-shrink:0;min-width:64px;}
.help-tab:hover{background:var(--surface-2);}
.help-tab--active{background:var(--accent-light);box-shadow:inset 0 0 0 1px var(--accent-muted);}
.help-tab-icon{font-size:18px;line-height:1;}
.help-tab-label{font-size:9px;font-weight:600;color:var(--ink-3);white-space:nowrap;line-height:1.2;}
.help-tab--active .help-tab-label{color:var(--accent);font-weight:700;}
.help-content{flex:1;overflow-y:auto;padding:20px 24px;}
.help-text{font-size:13px;color:var(--ink-2);line-height:1.75;}
.help-box{background:var(--surface-2);border:var(--border-thin);border-radius:var(--radius);padding:14px 16px;transition:background 0.4s;}
.help-box-title{font-size:11px;font-weight:800;color:var(--ink-3);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px;font-family:var(--font-sans);}
.help-box-item{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-2);line-height:1.6;padding:5px 0;}
.help-box-item+.help-box-item{border-top:1px solid var(--surface-3);}
.help-badge{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;background:var(--surface-3);color:var(--ink-2);white-space:nowrap;flex-shrink:0;font-family:var(--font-sans);}
.help-chip{display:inline-flex;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0;font-family:var(--font-sans);}
.help-chip--amber{background:var(--amber-light);color:var(--amber);}
.help-chip--red{background:var(--red-light);color:var(--red);}
.help-note{font-size:11px;color:var(--ink-4);margin-top:8px;font-style:italic;}
.help-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-top:var(--border-thin);flex-shrink:0;}
.help-dots{display:flex;gap:6px;}
.help-dot{width:7px;height:7px;border-radius:50%;background:var(--surface-3);cursor:pointer;transition:all 0.15s;}
.help-dot--active{background:var(--accent);transform:scale(1.2);}
.help-nav-btns{display:flex;gap:8px;}
.help-nav-btn{padding:7px 16px;border-radius:6px;border:var(--border-thin);background:transparent;color:var(--ink-2);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-sans);transition:all 0.15s;}
.help-nav-btn:hover{background:var(--surface-2);border-color:var(--ink-4);}
.help-nav-btn--primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.help-nav-btn--primary:hover{opacity:0.9;}
</style>
</body>
</html>
